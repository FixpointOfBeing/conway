[package]
name = "conway"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eventsource-stream = "0.2"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
toml = "1.1.8"
